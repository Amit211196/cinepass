services:
  postgres:
    image: postgres:16-alpine
    container_name: cinepass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinepass
      POSTGRES_USER: cinepass
      POSTGRES_PASSWORD: cinepass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinepass -d cinepass"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: cinepass-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cinepass
      SPRING_DATASOURCE_USERNAME: cinepass
      SPRING_DATASOURCE_PASSWORD: cinepass
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      JWT_EXPIRATION_MS: 2700000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: cinepass-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres-data:
