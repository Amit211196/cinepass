app:
  seed-data:
    enabled: false

spring:
  datasource:
    url: jdbc:h2:mem:repo_test_db;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  expiration-ms: 2700000

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN


