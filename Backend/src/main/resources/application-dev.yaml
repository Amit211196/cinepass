spring:
  datasource: # H2 database for dev environment
    url: jdbc:h2:file:./data/cinepass
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true